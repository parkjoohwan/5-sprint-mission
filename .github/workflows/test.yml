name: test.yml

on:
  pull_request:
    branches: [ 박주환 ]

env:
  SPRING_PROFILES_ACTIVE: test
  AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
  AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
  AWS_S3_REGION: ${{ vars.AWS_S3_REGION }}
  AWS_S3_PRESIGNED_URL_EXPIRATION: ${{ vars.AWS_S3_PRESIGNED_URL_EXPIRATION}}
  STORAGE_TYPE: ${{ vars.STORAGE_TYPE }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results

      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # assuming gradle jacoco plugin produces build/reports/jacoco/test/jacocoTestReport.xml
          bash <(curl -s https://codecov.io/bash) -f build/reports/jacoco/test/jacocoTestReport.xml -t $CODECOV_TOKEN || true